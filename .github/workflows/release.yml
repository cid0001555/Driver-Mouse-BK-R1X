name: Release Setup Wizard & Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-setup:
    name: Windows x64 1-Click Setup Wizard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --workspace

      - name: Build stripped LTO release binaries
        run: cargo build --release --workspace

      - name: Package standalone Setup Wizard (.exe)
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_name }}" -like "v*") { "${{ github.ref_name }}" } else { "v0.1.0" }
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          $outExe = "dist/release/BKR1X-Setup-$tag-x64.exe"
          .\target\release\bkr1x-cli.exe package-installer --output $outExe
          $hash = (Get-FileHash $outExe -Algorithm SHA256).Hash.ToLower()
          "$hash  BKR1X-Setup-$tag-x64.exe" | Out-File -Encoding utf8 "dist/release/BKR1X-Setup-$tag-x64.exe.sha256"

      - name: Upload Windows Setup Wizard artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-wizard
          path: dist/release/*

  build-linux-tarball:
    name: Linux x86_64 Native Tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build stripped LTO release binaries
        run: cargo build --release -p bkr1x-daemon -p bkr1x-cli -p bkr1x-gui

      - name: Package Linux tarball
        run: |
          TAG="${GITHUB_REF_NAME:-v0.1.0}"
          STAGE="bkr1x-linux-x86_64"
          mkdir -p "$STAGE" dist/release
          cp target/release/bkr1x-daemon target/release/bkr1x-cli target/release/bkr1x-gui README.md "$STAGE/"
          cp -r dist/linux profiles "$STAGE/"
          tar -czf "dist/release/BKR1X-$TAG-linux-x86_64.tar.gz" "$STAGE"
          (cd dist/release && sha256sum "BKR1X-$TAG-linux-x86_64.tar.gz" > "BKR1X-$TAG-linux-x86_64.tar.gz.sha256")

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist/release/*

  publish-github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows-setup, build-linux-tarball]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
