[package]
name = "bkr1x-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reactive zero-idle-CPU native OpenGL (glow) GUI configurator for the Fire Phoenix BK-R1X gaming mouse"

[[bin]]
name = "bkr1x-gui"
path = "src/main.rs"

[dependencies]
bkr1x-protocol.workspace = true
bkr1x-hal.workspace = true
eframe.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
