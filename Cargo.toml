[workspace]
resolver = "3"
members = [
    "crates/bkr1x-protocol",
    "crates/bkr1x-hal",
    "crates/bkr1x-daemon",
    "crates/bkr1x-cli",
    "crates/bkr1x-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Fire Phoenix BK-R1X Open Driver Contributors"]
repository = "https://github.com/driver-mouse-bkr1x/Driver-Mouse-BK-R1X"

[workspace.dependencies]
bkr1x-protocol = { path = "crates/bkr1x-protocol" }
bkr1x-hal = { path = "crates/bkr1x-hal" }
hidapi = { version = "2.6", default-features = false, features = ["linux-native"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
